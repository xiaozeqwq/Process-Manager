name: Build

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: write

jobs:
  build-fabric:
    name: Fabric
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Fabric
        run: ./gradlew :fabric:build --parallel --max-workers=4 --build-cache

      - name: Prepare Fabric artifact
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "MOD_VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp "fabric/build/libs/mccinserver-${VERSION}.jar" "dist/mccinserver-${VERSION}-fabric.jar"

      - name: Upload Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: fabric-jar
          path: dist/*.jar
          if-no-files-found: error

  build-neoforge:
    name: NeoForge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build NeoForge
        run: ./gradlew :neoforge:build --parallel --max-workers=4 --build-cache

      - name: Prepare NeoForge artifact
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "MOD_VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp "neoforge/build/libs/mccinserver-${VERSION}.jar" "dist/mccinserver-${VERSION}-neoforge.jar"

      - name: Upload NeoForge jar
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-jar
          path: dist/*.jar
          if-no-files-found: error

  release:
    name: Release
    needs: [build-fabric, build-neoforge]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read mod version
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "MOD_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download Fabric jar
        uses: actions/download-artifact@v4
        with:
          name: fabric-jar
          path: dist

      - name: Download NeoForge jar
        uses: actions/download-artifact@v4
        with:
          name: neoforge-jar
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.MOD_VERSION }}
          name: MCC In Server ${{ env.MOD_VERSION }}
          files: dist/*.jar
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
