name: Build

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: write

jobs:
  compile-common:
    name: Compile Common
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile common
        run: ./gradlew :common:build :common:transformProductionFabric :common:transformProductionNeoForge --parallel --max-workers=4 --build-cache

      - name: Upload common build
        uses: actions/upload-artifact@v4
        with:
          name: common-build
          path: common/build
          if-no-files-found: error

  build-fabric:
    name: Fabric
    needs: [compile-common]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Restore common build
        uses: actions/download-artifact@v4
        with:
          name: common-build
          path: common/build

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Fabric
        run: ./gradlew :fabric:build --parallel --max-workers=4 --build-cache

      - name: Prepare Fabric artifact
        run: |
          MOD_ID=$(grep '^mod_id=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "MOD_VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp "fabric/build/libs/${MOD_ID}-${VERSION}.jar" "dist/${MOD_ID}-${VERSION}-fabric.jar"
          cp "fabric/build/libs/${MOD_ID}-${VERSION}-thin.jar" "dist/${MOD_ID}-${VERSION}-fabric-thin.jar"
          cp "fabric/build/libs/${MOD_ID}-${VERSION}-dep.jar" "dist/${MOD_ID}-${VERSION}-fabric-dep.jar"

      - name: Upload Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: fabric-jar
          path: dist/*.jar
          if-no-files-found: error

  build-neoforge:
    name: NeoForge
    needs: [compile-common]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Restore common build
        uses: actions/download-artifact@v4
        with:
          name: common-build
          path: common/build

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build NeoForge
        run: ./gradlew :neoforge:build --parallel --max-workers=4 --build-cache

      - name: Prepare NeoForge artifact
        run: |
          MOD_ID=$(grep '^mod_id=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "MOD_VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp "neoforge/build/libs/${MOD_ID}-${VERSION}.jar" "dist/${MOD_ID}-${VERSION}-neoforge.jar"
          cp "neoforge/build/libs/${MOD_ID}-${VERSION}-thin.jar" "dist/${MOD_ID}-${VERSION}-neoforge-thin.jar"
          cp "neoforge/build/libs/${MOD_ID}-${VERSION}-dep.jar" "dist/${MOD_ID}-${VERSION}-neoforge-dep.jar"

      - name: Upload NeoForge jar
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-jar
          path: dist/*.jar
          if-no-files-found: error

  release:
    name: Release
    needs: [build-fabric, build-neoforge]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read mod version
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "MOD_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download Fabric jar
        uses: actions/download-artifact@v4
        with:
          name: fabric-jar
          path: dist

      - name: Download NeoForge jar
        uses: actions/download-artifact@v4
        with:
          name: neoforge-jar
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.MOD_VERSION }}
          name: Process Manager ${{ env.MOD_VERSION }}
          files: dist/*.jar
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
